server:
  port: 8084
  servlet:
    context-path: /api/v1

spring:
  application:
    name: result-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/examplatform}
    username: ${DB_USERNAME:examuser}
    password: ${DB_PASSWORD:exampass}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_history_result
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/exam_platform}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: result-service-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.examplatform.*, java.util.*"
        spring.json.value.default.type: "java.util.HashMap"
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

services:
  exam-service-url: ${EXAM_SERVICE_URL:http://exam-service:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
