server:
  port: 8081
  servlet:
    context-path: /api/v1
  compression:
    enabled: true

spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/examplatform}
    username: ${DB_USERNAME:examuser}
    password: ${DB_PASSWORD:exampass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: UserServicePool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      enable-idempotence: true
      properties:
        max.in.flight.requests.per.connection: 5

jwt:
  private-key-pem: ${JWT_PRIVATE_KEY_PEM}
  public-key-pem: ${JWT_PUBLIC_KEY_PEM}
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY:900000}       # 15 minutes
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY:604800000}  # 7 days

otp:
  ttl-seconds: 300        # 5 minutes
  length: 6
  max-attempts: 3
  lockout-seconds: 1800   # 30 minutes

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.examplatform: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
