server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # User Service — Auth routes that require JWT (subscribe, subscription-status)
        - id: user-service-auth-protected
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/auth/subscribe, /api/v1/auth/subscription-status
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"

        # User Service — Auth routes (no JWT required)
        - id: user-service-auth
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"
            - RewritePath=/api/v1/auth/(?<segment>.*), /api/v1/auth/${segment}

        # User Service — Admin user management (ADMIN / SUPER_ADMIN)
        - id: user-service-admin
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/admin/users, /api/v1/admin/users/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@userKeyResolver}"
            - RewritePath=/api/v1/admin/users(?<segment>.*), /api/v1/admin/users${segment}

        # User Service — Protected routes
        - id: user-service-protected
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/users/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                key-resolver: "#{@userKeyResolver}"

        # Exam Service — Image upload (no circuit breaker; must resolve before catch-all)
        - id: exam-service-images
          uri: http://exam-service:8082
          predicates:
            - Path=/api/v1/exams/images/upload, /api/v1/exams/images/bulk-upload
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"

        # Exam Service — Auth-required endpoints (must come before the public catch-all)
        # These endpoints need a valid JWT; expired tokens return 401 → frontend redirects to login.
        - id: exam-service-auth
          uri: http://exam-service:8082
          predicates:
            - Path=/api/v1/exams/*/paper/**, /api/v1/exams/*/attempt, /api/v1/exams/*/enroll, /api/v1/exams/*/approve, /api/v1/exams/*/preview, /api/v1/exams/upload, /api/v1/exams/upload/**, /api/v1/exams/mine, /api/v1/exams/*/publish, /api/v1/exams/admin/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 300
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: exam-service-cb
                fallbackUri: forward:/fallback/exam

        # Exam Service — Public browse (categories, published exam list, exam metadata)
        # Optional auth: logged-in users get personalised data; anonymous users can still browse.
        - id: exam-service
          uri: http://exam-service:8082
          predicates:
            - Path=/api/v1/exams, /api/v1/exams/**, /api/v1/questions, /api/v1/questions/**
          filters:
            - OptionalJwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 300
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: exam-service-cb
                fallbackUri: forward:/fallback/exam

        # Test Engine — HTTP
        - id: test-engine-http
          uri: http://test-engine:8083
          predicates:
            - Path=/api/v1/sessions/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 300
                redis-rate-limiter.burstCapacity: 600
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: test-engine-cb
                fallbackUri: forward:/fallback/session

        # Test Engine — WebSocket (sticky sessions required)
        - id: test-engine-websocket
          uri: ws://test-engine:8083
          predicates:
            - Path=/ws/**
          filters:
            - JwtAuthFilter
            - name: CircuitBreaker
              args:
                name: ws-cb

        # Result Service
        - id: result-service
          uri: http://result-service:8084
          predicates:
            - Path=/api/v1/results/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@userKeyResolver}"

        # Payment Service — Webhook (no JWT, Razorpay calls this)
        - id: payment-service-webhook
          uri: http://payment-service:8085
          predicates:
            - Path=/api/v1/payments/webhook
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@ipKeyResolver}"

        # Payment Service — Admin endpoints
        - id: payment-service-admin
          uri: http://payment-service:8085
          predicates:
            - Path=/api/v1/payments/admin/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@userKeyResolver}"

        # Payment Service — Student endpoints (JWT required)
        - id: payment-service
          uri: http://payment-service:8085
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: payment-service-cb
                fallbackUri: forward:/fallback/payment

      # Global CORS
      globalcors:
        corsConfigurations:
          "[/**]":
            allowedOriginPatterns:
              - "https://*.examplatform.com"
              - "http://localhost:3000"
              - "http://frontend:3000"
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
            allowedHeaders: ["*"]
            allowCredentials: true
            maxAge: 3600

      # Default filters applied to all routes
      default-filters:
        - AddResponseHeader=X-Frame-Options, DENY
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=Referrer-Policy, no-referrer
        - name: Retry
          args:
            retries: 2
            statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
            methods: GET

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  public-key-pem: ${JWT_PUBLIC_KEY_PEM:GENERATE_ME}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 5
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
  # CRITICAL: without this, Spring Cloud Gateway's circuit-breaker filter falls back to an
  # undocumented 1-SECOND default call timeout. Any backend call that occasionally runs past
  # 1s (cold JVM/JIT warmup, a GC pause, MongoDB connection-pool lazy-init on the first real
  # request) gets aborted by the gateway and counted as a circuit-breaker failure — even though
  # the backend itself never errors. Enough of those within slidingWindowSize trips the breaker
  # open for 30s, during which every request gets the fallback immediately. This was the cause
  # of "session start fails the first time, works after a reload/retry."
  timelimiter:
    configs:
      default:
        timeout-duration: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.examplatform.gateway: DEBUG
