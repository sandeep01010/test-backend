name: Exam Platform CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: examplatform.azurecr.io
  AKS_CLUSTER: exam-aks
  AKS_RESOURCE_GROUP: exam-rg

jobs:
  # ============================================================
  # BUILD & TEST
  # ============================================================
  build:
    name: Build & Test — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, exam-service, test-engine, result-service, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run unit tests
        working-directory: services/${{ matrix.service }}
        run: mvn -B -ntp clean verify

      - name: Run integration tests (Testcontainers)
        working-directory: services/${{ matrix.service }}
        run: mvn -B -ntp failsafe:integration-test failsafe:verify
        env:
          TESTCONTAINERS_RYUK_DISABLED: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/

  # ============================================================
  # CODE QUALITY
  # ============================================================
  code-quality:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarQube requires full history

      - name: SonarQube Analysis
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=examplatform
            -Dsonar.projectKey=exam-platform
            -Dsonar.coverage.exclusions=**/dto/**,**/model/**,**/*Application.java
            -Dsonar.qualitygate.wait=true

  # ============================================================
  # SECURITY SCAN
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service: [user-service, exam-service, test-engine, result-service, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ matrix.service }}:scan \
            -f infra/docker/Dockerfile.${{ matrix.service }} .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.service }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'   # Fail on CRITICAL or HIGH

      - name: Upload security results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif

  # ============================================================
  # DOCKER BUILD & PUSH
  # ============================================================
  docker-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    strategy:
      matrix:
        service: [user-service, exam-service, test-engine, result-service, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.service }}:buildcache,mode=max

  # ============================================================
  # DEPLOY TO STAGING
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-push
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}-staging
          cluster-name: ${{ env.AKS_CLUSTER }}-staging

      - name: Deploy via ArgoCD (staging)
        run: |
          argocd app sync exam-platform-staging \
            --revision ${{ github.sha }} \
            --timeout 300
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}

      - name: Run smoke tests
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh https://staging-api.examplatform.com

      - name: Run load test (k6)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: infra/load-tests/exam-flow.js
          flags: --vus 1000 --duration 60s --threshold http_req_duration{p(99)<500}
        env:
          K6_API_BASE: https://staging-api.examplatform.com

  # ============================================================
  # DEPLOY TO PRODUCTION (manual approval required)
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      # Requires reviewer approval in GitHub Environments settings
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}

      - name: Set AKS context (Production)
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER }}

      - name: Blue-Green Deploy via ArgoCD
        run: |
          # Update image tags in GitOps repo
          git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/examplatform/k8s-manifests.git
          cd k8s-manifests

          # Update all service image tags
          for service in user-service exam-service test-engine result-service api-gateway; do
            sed -i "s|image: .*/${service}:.*|image: ${{ env.REGISTRY }}/${service}:sha-${{ github.sha }}|g" \
              deployments/${service}-deployment.yaml
          done

          git config user.email "ci@examplatform.com"
          git config user.name "CI Bot"
          git add .
          git commit -m "Deploy ${{ github.sha }} to production"
          git push

          # ArgoCD auto-syncs from GitOps repo
          argocd app sync exam-platform-prod --timeout 600
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER_PROD }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN_PROD }}

      - name: Production smoke tests
        run: ./scripts/smoke-test.sh https://api.examplatform.com

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {"text": "✅ Production deploy successful: ${{ github.sha }} by ${{ github.actor }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {"text": "🚨 Production deploy FAILED: ${{ github.sha }} — @channel please investigate"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
