apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: test-engine-hpa
  namespace: exam-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: test-engine
  minReplicas: 20
  maxReplicas: 500
  metrics:
    # Scale on CPU
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

    # Scale on memory
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70

    # Scale on custom metric: WebSocket connections per pod
    # Requires Prometheus adapter configured
    - type: Pods
      pods:
        metric:
          name: websocket_sessions_active
        target:
          type: AverageValue
          averageValue: "2000"  # Max 2000 WebSocket connections per pod

  behavior:
    scaleUp:
      # Scale up fast for exam starts
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 50
          periodSeconds: 60    # Add 50 pods/minute
        - type: Percent
          value: 100
          periodSeconds: 60    # Or double, whichever is larger
      selectPolicy: Max

    scaleDown:
      # Scale down slowly to avoid disrupting active exams
      stabilizationWindowSeconds: 600  # 10 min window
      policies:
        - type: Pods
          value: 5
          periodSeconds: 60    # Remove max 5 pods/minute
      selectPolicy: Min

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-service-hpa
  namespace: exam-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  minReplicas: 5
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 10
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: result-service-hpa
  namespace: exam-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: result-service
  minReplicas: 3
  maxReplicas: 50
  metrics:
    # Scale on Kafka consumer lag (requires KEDA or Prometheus adapter)
    - type: External
      external:
        metric:
          name: kafka_consumer_lag_sum
          selector:
            matchLabels:
              topic: exam-events
              group: result-service-consumer
        target:
          type: AverageValue
          averageValue: "1000"
